<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Tours - Contact Us</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">University Tours</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main class="container my-5">
        <h1>Contact Us</h1>


        <form style="max-width: 900px" class="mx-auto">
            <div class="row g-4">
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="firstName" class="form-label">First name</label>

                        <input type="text" class="form-control" id="firstName">
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="lastName">
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                        <div class="form-text">
                            We dont share your email with anyone else.
                        </div>
                    </div>
                </div>
                <div class="md:col-6">
                    <div>
                        <label for="tourType" class="form-label">Select a tour type</label>
                        <select class="form-control" id="tourType" size="3" aria-label="Size 3 select example">
                            <option selected>Open</option>
                            <option value="1">Full Tour</option>
                            <option value="2">Half-Day Tour</option>
                            <option value="3">6 Building Speed Tour</option>
                        </select>
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="fieldTextarea" class="form-label">Message</label>
                        <textarea class="form-control" id="fieldTextarea" rows="3"></textarea>
                        <div class="form-text">
                            Please include any special requests for accomodation.
                        </div>
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <input type="checkbox" id="checkLabel" class="check" />
                        <label for="checkLabel">By selecting this box, I agree to be contacted by Campus Tours.</label>
                    </div>
                </div>

            </div>
            <button class="btn-solid theme-primary mt-5">Contact Us</button>
        </form>

    </main>

    <footer class="container my-5">
        <p class="fg-3">&copy; 2026 University Tours</p>
    </footer>

</body>

</html>
